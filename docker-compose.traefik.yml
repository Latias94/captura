version: "3.9"

services:
  traefik:
    image: traefik:v3.0
    container_name: captura-traefik
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8081:8080" # dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  api:
    labels:
      - traefik.enable=true
      - traefik.http.routers.captura.rule=Host(`${CAPTURA_HOST:-captura.localhost}`)
      - traefik.http.routers.captura.entrypoints=web
      - traefik.http.services.captura.loadbalancer.server.port=8080
    # api service definition inherited from base compose (build/image, env, etc.)

