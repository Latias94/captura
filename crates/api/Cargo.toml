[package]
name = "captura-api"
version = "0.1.0"
edition = "2021"

[lib]
name = "captura_api"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sea-orm.workspace = true
chrono.workspace = true
captura-common = { path = "../common" }
captura-storage = { path = "../storage" }
captura-migration = { path = "../migration" }
captura-rules = { path = "../rules" }
captura-fetcher = { path = "../fetcher" }
captura-crawler = { path = "../crawler" }
captura-scheduler = { path = "../scheduler" }
captura-pipeline = { path = "../pipeline" }
captura-service = { path = "../service" }
captura-types = { path = "../types" }
sha2.workspace = true
argon2.workspace = true
rand_core.workspace = true
axum-extra = { version = "0.12", features = ["typed-header"] }
headers = "0.4"
quick-xml.workspace = true
url.workspace = true
md-5.workspace = true
base64.workspace = true
reqwest.workspace = true
scraper.workspace = true
once_cell.workspace = true
regex.workspace = true
urlencoding = "2"
hex = "0.4"
tower-http.workspace = true
hmac.workspace = true
openidconnect = { version = "3", default-features = true, features = ["reqwest"] }
captura-webui = { path = "../webui" }

[dev-dependencies]
http-body-util = "0.1"
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
captura-testkit = { path = "../testkit" }
