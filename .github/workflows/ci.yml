name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --all-features
      - name: Run API crate tests (sqlite)
        run: cargo test -p captura-api --all-features -- --test-threads=1

  # Optional DB backends (disabled by default). To enable, set repository
  # variables/secrets CAPTURA_TEST_PG_URL / CAPTURA_TEST_MY_URL.
  # These jobs are skipped if the URL is not provided.
  pg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: captura
          POSTGRES_PASSWORD: captura
          POSTGRES_DB: captura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U captura"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RUST_BACKTRACE: "1"
      CAPTURA_TEST_PG_URL: postgres://captura:captura@postgres:5432/captura
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: Swatinem/rust-cache@v2
      - name: Test Postgres backend (ignored tests)
        run: cargo test -p captura-api --test db_backends -- --ignored --nocapture

  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: captura
          MYSQL_USER: captura
          MYSQL_PASSWORD: captura
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RUST_BACKTRACE: "1"
      CAPTURA_TEST_MY_URL: mysql://captura:captura@mysql:3306/captura
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: Swatinem/rust-cache@v2
      - name: Test MySQL backend (ignored tests)
        run: cargo test -p captura-api --test db_backends -- --ignored --nocapture
