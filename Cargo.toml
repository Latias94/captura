[workspace]
members = [
  "crates/common",
  "crates/storage",
  "crates/migration",
  "crates/api",
  "crates/cli",
  "crates/net",
  "crates/types",
  "crates/fetcher",
  "crates/crawler",
  "crates/extract",
  "crates/hub",
  "crates/scheduler",
  "crates/pipeline",
  "crates/service",
  "crates/testkit",
  "crates/webui",
  "crates/hub-macros",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Latias94/captura"
homepage = "https://github.com/Latias94/captura"
description = "Self-hosted modern RSS hub written in Rust (axum + SeaORM), with RSSHub-style routes and a scraping DSL."

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros", "json", "form"] }
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
] }
feed-rs = "2"
regex = "1"
reqwest = { version = "0.12", features = [
  "json",
  "gzip",
  "brotli",
  "deflate",
  "cookies",
  "stream",
] }
sea-orm = { version = "2.0.0-rc.18", default-features = false, features = [
  "macros",
  "sqlx-all",
  "with-json",
  "with-chrono",
  "runtime-tokio-rustls",
] }
sea-orm-migration = { version = "2.0.0-rc.18" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
spider = { version = "2", default-features = false }
spider_utils = { version = "2" }
scraper = "0.24"
once_cell = "1"
inventory = "0.3"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hmac = "0.12"
quick-xml = "0.38"
md-5 = "0.10"
base64 = "0.22"
ammonia = "4"
urlencoding = "2"
hex = "0.4"
tower-http = { version = "0.6", features = ["set-header", "trace"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
headers = "0.4"
openidconnect = { version = "3", default-features = true, features = ["reqwest"] }
http-body-util = "0.1"
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
dom_smoothie = "0.13"
html-escape = "0.2.13"
encoding_rs = "0.8"
flate2 = "1.0"
serde_urlencoded = "0.7"
askama = { version = "0.13", features = ["serde_json"] }
mime = "0.3"
rust-embed = "8"
