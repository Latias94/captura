[workspace]
members = [
  "crates/common",
  "crates/storage",
  "crates/migration",
  "crates/api",
  "crates/types",
  "crates/fetcher",
  "crates/crawler",
  "crates/extract",
  "crates/hub",
  "crates/scheduler",
  "crates/pipeline",
  "crates/service",
  "crates/testkit",
  "crates/webui",
  "crates/hub-macros",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["captura contributors"]

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros", "json", "form"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
feed-rs = "2"
regex = "1"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "cookies", "stream"] }
sea-orm = { version = "2.0.0-rc.18", default-features = false, features = ["macros", "sqlx-all", "with-json", "with-chrono", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "2.0.0-rc.18" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
async-trait = "0.1"
spider = { version = "2", default-features = false }
spider_utils = { version = "2", package = "spider_utils" }
scraper = "0.24"
once_cell = "1"
inventory = "0.3"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hmac = "0.12"
quick-xml = "0.38"
md-5 = "0.10"
base64 = "0.22"
ammonia = "4"
urlencoding = "2"
hex = "0.4"
tower-http = { version = "0.6", features = ["set-header", "trace"] }
